[project]
name = "metalurgica-mayer-backend"
version = "0.1.0"
description = "API do ERP e do site institucional da Metalúrgica Mayer (PAC VI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
# Scripts gerados pelo Alembic seguem o template dele, não o nosso estilo.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (ordena imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade (sintaxe moderna)
    "B",    # flake8-bugbear (bugs comuns)
    "C4",   # comprehensions melhores
    "SIM",  # simplificações
    "RUF",  # regras do próprio ruff
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imports não usados em __init__ são ok (re-export)

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

# Afrouxado para projeto real não morrer em ruído.
warn_return_any = false
disallow_untyped_decorators = false  # FastAPI tem decorators sem tipo

[[tool.mypy.overrides]]
module = "tests.*"
# Testes priorizam legibilidade: não exigimos anotação completa nem parâmetros de
# tipo em genéricos. Erros de uso real — call-arg, arg-type, attr-defined —
# seguem ativos.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disable_error_code = ["var-annotated"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
