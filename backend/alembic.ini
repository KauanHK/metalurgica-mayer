# Configuração do Alembic. A URL do banco NÃO fica aqui: `migrations/env.py` a lê
# de `app.core.settings`, para que migration e aplicação nunca apontem para
# bancos diferentes.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Prefixa o arquivo com a data, para que `ls migrations/versions` mostre a ordem
# real em que as migrations foram escritas — o hash da revisão não ordena nada.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Formata a migration recém-gerada, para ela nascer no mesmo padrão do resto.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
