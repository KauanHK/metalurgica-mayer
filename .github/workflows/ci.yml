name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tipos, migrations e testes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metalurgica_mayer_test
          POSTGRES_USER: metalurgica
          POSTGRES_PASSWORD: metalurgica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metalurgica -d metalurgica_mayer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: metalurgica_mayer_test
      POSTGRES_USER: metalurgica
      POSTGRES_PASSWORD: metalurgica
      JWT_SECRET: chave-de-ci-sem-valor-em-producao
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MIN: 30
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      TEST_DATABASE_URL: postgresql+asyncpg://metalurgica:metalurgica@localhost:5432/metalurgica_mayer_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (ruff)
        run: uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy .

      - name: Aplicar as migrations
        run: uv run alembic upgrade head

      - name: Testes (pytest)
        run: uv run pytest -v

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Avisar quando ainda não há lockfile
        if: hashFiles('frontend/package-lock.json') == ''
        run: echo "frontend/package-lock.json ainda não existe; nada a verificar."

      - name: Instalar o Node
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run build
